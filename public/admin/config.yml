local_backend: true

backend:
  name: github
  repo: OWNER/REPO
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "gallery"
    label: "Galería de Obras"
    label_singular: "Obra"
    folder: "src/content/gallery"
    create: true
    delete: true
    extension: "md"
    slug: "{{slug}}"
    sortable_fields: ["order", "title", "year"]
    summary: "{{title}} ({{year}}) — Orden: {{order}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Técnica", name: "technique", widget: "string", default: "Óleo sobre lienzo" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image", media_folder: "/public/images/gallery", public_folder: "/images/gallery" }
      - { label: "Ancho (px)", name: "width", widget: "number", value_type: "int" }
      - { label: "Alto (px)", name: "height", widget: "number", value_type: "int" }
      - { label: "Orden en galería", name: "order", widget: "number", value_type: "int" }
      - { label: "Descripción (opcional)", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Páginas"
    files:
      - label: "About / Biografía"
        name: "about"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Cita Principal", name: "quote", widget: "text" }
          - { label: "Foto de Artista", name: "portrait", widget: "image", media_folder: "/public/images/about", public_folder: "/images/about" }
          - { label: "Biografía (Markdown)", name: "body", widget: "markdown" }

      - label: "Home / Portada"
        name: "home"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Imagen Hero de fondo", name: "heroImage", widget: "image", media_folder: "/public/images/gallery", public_folder: "/images/gallery" }
          - { label: "Frase de Visión Artística", name: "artisticVisionQuote", widget: "text" }
